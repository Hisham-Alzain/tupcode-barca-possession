[project]
name = "barca-possession"
version = "0.1.0"
description = "More Than A Hack 2027: per-frame team possession (H/A/D/X) from uncorrected tracking"
requires-python = ">=3.12,<3.13"
# Exact versions: the bench numbers in .planning/LOOP.md were produced with these.
dependencies = [
    "numpy==2.4.6",
    "scipy==1.18.0",
    "pandas==2.3.3",     # vendored official scorer (vendor/mtah)
    "kloppy==3.19.0",    # reads the Metrica FIFA/EPTS tracking
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
possess = "possess.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/possess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "vendor/mtah"]
addopts = "-q -p no:cacheprovider"
